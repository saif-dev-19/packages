name: Django CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        env:
          DEBUG: "True"
          EMAIL_BACKEND: "django.core.mail.backends.locmem.EmailBackend"
          EMAIL_HOST: "localhost"
          EMAIL_PORT: "587"
          EMAIL_USE_TLS: "False"
          EMAIL_HOST_USER: "ci@example.com"
          EMAIL_HOST_PASSWORD: "ci-placeholder-password"
          DEFAULT_FROM_EMAIL: "ci@example.com"
          JWT_SHARED_SECRET: "ci-only-test-secret-not-for-production"
          DB_NAME: "ci_db"
          DB_USER: "ci_user"
          DB_PASSWORD: "ci-placeholder-password"
        run: python manage.py test


      - name: Build Docker image
        run: docker build -t packages-ci:latest .
